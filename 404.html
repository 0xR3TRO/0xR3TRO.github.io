<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>klefas.me — nie znaleziono strony</title>
        <meta name="robots" content="noindex" />
        <script>
            // Old addresses of renamed project sites: send /old/rest to /new/rest.
            const MOVED = { "/r3tro-arcade/": "/arcade/", "/web-lab/": "/lab/" };
            for (const [from, to] of Object.entries(MOVED)) {
                if (location.pathname.startsWith(from)) {
                    location.replace(to + location.pathname.slice(from.length) + location.search + location.hash);
                }
            }
        </script>
        <style>
            body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; background: #0a0a0f; color: #e8e8f0; font: 16px/1.5 system-ui, sans-serif; }
            a { color: #6c63ff; }
        </style>
    </head>
    <body>
        <main>
            <h1>404</h1>
            <p>Nie ma takiej strony. <a href="/">Wróć na klefas.me</a></p>
        </main>
    </body>
</html>

# Checks run on every pull request and on pushes to main and develop.
name: CI

on:
  pull_request:
  push:
    branches: ["main", "develop"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate HTML
        run: npx --yes html-validate@9 --config .htmlvalidate.json "**/*.html"
      - name: Check required files
        run: |
          missing=0
          for f in index.html 404.html CNAME .nojekyll LICENSE; do
            [ -e "$f" ] || { echo "::error::missing $f"; missing=1; }
          done
          exit $missing

  design:
    name: design checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: design/web3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: design/web3/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint, unit tests and stale-build check
        run: npm run check

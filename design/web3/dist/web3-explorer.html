/* src/styles/base.css */
*,
*::before,
*::after {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-padding-top: calc(var(--chrome-h) + var(--header-h));
}
body {
  margin: 0;
  background: var(--x-bg);
  color: var(--x-fg);
  font-family: var(--font-sans);
  font-size: var(--text-md);
  line-height: var(--leading-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: var(--z-chrome);
  background: var(--x-bg);
}
h1,
h2,
h3,
h4,
p,
ul,
ol,
dl,
dd,
figure,
blockquote,
pre {
  margin: 0;
}
ul,
ol {
  padding: 0;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
a {
  color: inherit;
}
svg {
  flex: none;
}
table {
  border-collapse: collapse;
}
[hidden] {
  display: none !important;
}
:focus-visible {
  outline: 2px solid var(--focus, var(--x-fg));
  outline-offset: 3px;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}
.skip-link {
  position: absolute;
  left: var(--gutter);
  top: var(--space-2);
  z-index: var(--z-overlay);
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-sm);
  background: var(--fg);
  color: var(--bg);
  font-size: var(--text-sm);
  font-weight: 600;
  text-decoration: none;
  transform: translateY(-300%);
}
.skip-link:focus {
  transform: none;
}
.stage {
  position: relative;
  min-height: calc(100vh - var(--chrome-h));
  background: var(--x-bg);
  color: var(--x-fg);
  overflow-x: clip;
}
.stage:not([data-proposal]) {
  --bg: var(--x-bg);
  --bg-alt: var(--x-surface);
  --surface: var(--x-surface);
  --surface-raised: var(--x-surface);
  --line: var(--x-line);
  --line-strong: var(--x-line);
  --fg: var(--x-fg);
  --fg-muted: var(--x-muted);
  --accent: var(--x-hi);
  --accent-text: var(--x-fg);
  --on-accent: var(--x-on);
  --focus: var(--x-fg);
}
.stage[data-proposal] {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body, var(--font-sans));
}
main:focus {
  outline: none;
}
.container {
  width: min(100% - 2 * var(--gutter), var(--container));
  margin-inline: auto;
}
.container--narrow {
  --container: var(--container-narrow);
}
.section {
  padding-block: var(--section-y);
}
.section--tight {
  padding-block: var(--section-y-tight);
}
.stack {
  display: grid;
  gap: var(--stack, var(--space-5));
  align-content: start;
}
.cluster {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--cluster, var(--space-3));
}
.list-reset {
  list-style: none;
}
.t-display {
  font-family: var(--font-display, var(--font-sans));
  font-size: var(--text-5xl);
  font-weight: var(--display-weight, 800);
  line-height: var(--leading-tight);
  letter-spacing: var(--track-display);
  text-wrap: balance;
}
.t-h1 {
  font-family: var(--font-display, var(--font-sans));
  font-size: var(--text-4xl);
  font-weight: var(--heading-weight, 800);
  line-height: var(--leading-tight);
  letter-spacing: var(--track-display);
  text-wrap: balance;
}
.t-h2 {
  font-family: var(--font-display, var(--font-sans));
  font-size: var(--text-3xl);
  font-weight: var(--heading-weight, 800);
  line-height: var(--leading-snug);
  letter-spacing: var(--track-heading);
  text-wrap: balance;
}
.t-h3 {
  font-size: var(--text-xl);
  font-weight: 700;
  line-height: var(--leading-snug);
  letter-spacing: var(--track-tight);
}
.t-lead {
  max-width: var(--measure);
  color: var(--fg-muted);
  font-size: var(--text-lg);
  line-height: var(--leading-normal);
}
.t-body {
  max-width: var(--measure);
}
.t-small {
  color: var(--fg-muted);
  font-size: var(--text-sm);
}
.t-label {
  color: var(--fg-muted);
  font-family: var(--font-mono);
  font-size: var(--text-2xs);
  font-weight: 500;
  letter-spacing: var(--track-label);
  text-transform: uppercase;
}
.t-mono {
  font-family: var(--font-mono);
  font-size: var(--text-sm);
}
.num {
  font-variant-numeric: tabular-nums;
}
.muted {
  color: var(--fg-muted);
}
.accent {
  color: var(--accent-text);
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: 2.75rem;
  padding: var(--space-2) var(--space-5);
  border: 1px solid var(--line-strong);
  border-radius: var(--btn-radius, var(--radius-pill));
  background: transparent;
  color: var(--fg);
  font-family: var(--font-body, var(--font-sans));
  font-size: var(--text-sm);
  font-weight: 600;
  line-height: 1;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
  transition:
    background-color var(--dur-fast) var(--ease-out),
    border-color var(--dur-fast) var(--ease-out),
    color var(--dur-fast) var(--ease-out),
    transform var(--dur-fast) var(--ease-out);
}
.btn:hover {
  border-color: var(--fg);
}
.btn:active {
  transform: translateY(1px);
}
.btn--primary {
  border-color: var(--primary-bg, var(--fg));
  background: var(--primary-bg, var(--fg));
  color: var(--primary-fg, var(--bg));
}
.btn--primary:hover {
  border-color: var(--primary-bg, var(--fg));
  background: color-mix(in srgb, var(--primary-bg, var(--fg)) 86%, var(--bg));
}
.btn--accent {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--on-accent);
}
.btn--accent:hover {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 86%, var(--fg));
}
.btn--ghost {
  border-color: transparent;
}
.btn--ghost:hover {
  border-color: transparent;
  background: var(--surface-raised);
}
.btn--sm {
  min-height: 2.25rem;
  padding: var(--space-1) var(--space-3);
  font-size: var(--text-xs);
}
.btn[disabled] {
  opacity: 0.5;
  cursor: not-allowed;
}
.theme-toggle {
  display: inline-grid;
  place-items: center;
  width: 2.5rem;
  height: 2.5rem;
  border: 1px solid var(--line-strong);
  border-radius: var(--btn-radius, var(--radius-pill));
  background: transparent;
  color: inherit;
  cursor: pointer;
}
.theme-toggle:hover {
  border-color: var(--fg);
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: var(--space-1) var(--space-3);
  border: 1px solid var(--line);
  border-radius: var(--chip-radius, var(--radius-pill));
  background: var(--surface);
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  line-height: var(--leading-normal);
  white-space: nowrap;
}
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}
.chip-toggle {
  min-height: 2.25rem;
  padding: var(--space-1) var(--space-4);
  border: 1px solid var(--line-strong);
  border-radius: var(--chip-radius, var(--radius-pill));
  background: transparent;
  color: var(--fg);
  font-size: var(--text-sm);
  cursor: pointer;
}
.chip-toggle:hover {
  border-color: var(--fg);
}
.chip-toggle[aria-pressed=true] {
  border-color: var(--fg);
  background: var(--fg);
  color: var(--bg);
  font-weight: 600;
}
.ph {
  border-radius: var(--radius-xs);
  outline: 1px dashed var(--line-strong);
  outline-offset: 2px;
  color: var(--fg-muted);
}
.sample-note {
  color: var(--fg-muted);
  font-size: var(--text-xs);
}
.mark {
  display: block;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  color: inherit;
  text-decoration: none;
}
.brand__word {
  font-size: var(--text-lg);
  font-weight: 800;
  letter-spacing: var(--track-heading);
}
.icon {
  display: inline-block;
  vertical-align: middle;
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* src/styles/shell.css */
.xc {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: var(--z-chrome);
  display: grid;
  gap: var(--space-2);
  padding-block: var(--space-2);
  padding-inline: var(--gutter);
  border-bottom: 1px solid var(--x-line);
  background: var(--x-bg);
  color: var(--x-fg);
  font-family: var(--font-sans);
  font-size: var(--text-xs);
}
.xc__row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2) var(--space-5);
}
.xc__brand {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  color: inherit;
  font-size: var(--text-sm);
  font-weight: 800;
  letter-spacing: var(--track-tight);
  text-decoration: none;
}
.xc__sub {
  color: var(--x-muted);
  font-family: var(--font-mono);
  font-size: var(--text-2xs);
  font-weight: 500;
  letter-spacing: 0;
}
.xc__nav,
.xc__group {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-1);
}
.xc__label {
  margin-right: var(--space-1);
  color: var(--x-muted);
  font-family: var(--font-mono);
  font-size: var(--text-2xs);
  letter-spacing: var(--track-label);
  text-transform: uppercase;
}
.xc__btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  min-height: 2rem;
  padding: var(--space-1) var(--space-3);
  border: 1px solid var(--x-line);
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--x-fg);
  font-size: var(--text-xs);
  font-weight: 500;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
}
.xc__btn:hover {
  border-color: var(--x-fg);
}
.xc__btn[aria-current],
.xc__btn[aria-pressed=true] {
  border-color: var(--x-hi);
  background: var(--x-hi);
  color: var(--x-on);
  font-weight: 700;
}
.xc__num {
  font-family: var(--font-mono);
  font-size: var(--text-2xs);
  opacity: 0.7;
}
.xc__divider {
  width: 1px;
  height: 1.25rem;
  margin-inline: var(--space-1);
  background: var(--x-line);
}
.xc :focus-visible {
  outline-color: var(--x-fg);
}
.xv {
  display: grid;
  gap: var(--section-y-tight);
  padding-block: var(--section-y-tight) var(--section-y);
}
.xv__intro {
  display: grid;
  gap: var(--space-5);
  justify-items: start;
}
.xv__intro .t-h1 {
  max-width: 18ch;
}
.xv__grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 21rem), 1fr));
  gap: var(--space-5);
}
.xv-card {
  display: grid;
  grid-template-rows: auto 1fr auto;
  border: 1px solid var(--x-line);
  border-radius: var(--radius-lg);
  background: var(--x-surface);
  overflow: hidden;
}
.xv-card__thumb {
  padding: var(--space-4);
  border-bottom: 1px solid var(--x-line);
  color: var(--x-fg);
}
.schematic {
  display: block;
  width: 100%;
  height: auto;
}
.xv-card__body {
  display: grid;
  gap: var(--space-3);
  align-content: start;
  padding: var(--space-5);
}
.xv-card__concept {
  color: var(--x-muted);
  font-size: var(--text-sm);
}
.xv-card__tags {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}
.xv-card__signature {
  display: grid;
  gap: var(--space-1);
  font-size: var(--text-sm);
}
.xv-card__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  padding: var(--space-4) var(--space-5) var(--space-5);
}
.xv__rules {
  display: grid;
  gap: var(--space-6);
}
.xv-rules {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr));
  gap: var(--space-5);
}
.xv-rules li {
  display: grid;
  gap: var(--space-2);
  padding-top: var(--space-4);
  border-top: 1px solid var(--x-line);
}
.xv-rules__n {
  color: var(--x-muted);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
}
.xm {
  overflow-x: auto;
  border: 1px solid var(--x-line);
  border-radius: var(--radius-lg);
  background: var(--x-surface);
}
.xm__table {
  width: 100%;
  min-width: 64rem;
  font-size: var(--text-sm);
}
.xm__table th,
.xm__table td {
  padding: var(--space-4);
  border-bottom: 1px solid var(--x-line);
  text-align: left;
  vertical-align: top;
}
.xm__table tbody tr:last-child > * {
  border-bottom: 0;
}
.xm__table thead th {
  vertical-align: bottom;
}
.xm__table tbody th,
.xm__corner {
  position: sticky;
  left: 0;
  z-index: var(--z-raised);
  width: 11rem;
  background: var(--x-surface);
  color: var(--x-muted);
  font-family: var(--font-mono);
  font-size: var(--text-2xs);
  font-weight: 500;
  letter-spacing: var(--track-label);
  text-transform: uppercase;
}
.xm__name {
  display: block;
  margin-block: var(--space-1);
  font-size: var(--text-xl);
  font-weight: 800;
  letter-spacing: var(--track-heading);
}
.xm__open {
  display: flex;
  gap: var(--space-3);
  font-size: var(--text-xs);
  font-weight: 500;
}
.xm__list {
  display: grid;
  gap: var(--space-2);
  padding-left: var(--space-4);
}
.xm__table .is-picked {
  background: color-mix(in srgb, var(--x-fg) 6%, var(--x-surface));
}
.xd {
  display: grid;
  gap: var(--space-5);
  justify-items: start;
  padding: var(--space-6);
  border: 1px solid var(--x-line);
  border-radius: var(--radius-lg);
  background: var(--x-surface);
}
.xd__summary {
  font-size: var(--text-xl);
  font-weight: 700;
  letter-spacing: var(--track-tight);
}
.xv__decision {
  display: grid;
  gap: var(--space-5);
}
.smap {
  padding-block: var(--section-y-tight) var(--section-y);
}
.smap__head {
  display: grid;
  gap: var(--space-4);
  margin-bottom: var(--space-8);
}
.smap__tree {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 0.8fr) minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--space-5) var(--space-9);
  align-items: center;
}
.smap__lines {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
}
.smap__lines path {
  fill: none;
  stroke: var(--line-strong);
  stroke-width: 1.5;
}
.smap__col {
  position: relative;
  display: grid;
  gap: var(--space-4);
}
.smap__node {
  display: grid;
  gap: var(--space-1);
  padding: var(--space-4) var(--space-5);
  border: 1px solid var(--line);
  border-radius: var(--card-radius, var(--radius-md));
  background: var(--surface);
  color: var(--fg);
  text-decoration: none;
  transition: border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.smap__node:hover {
  border-color: var(--fg);
  transform: translateY(-2px);
}
.smap__node--root {
  border-color: var(--fg);
  background: var(--fg);
  color: var(--bg);
}
.smap__path {
  color: var(--accent-text);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
}
.smap__node--root .smap__path,
.smap__node--root .smap__text {
  color: var(--bg);
  opacity: 0.8;
}
.smap__title {
  font-size: var(--text-lg);
  font-weight: 800;
  letter-spacing: var(--track-tight);
}
.smap__text {
  color: var(--fg-muted);
  font-size: var(--text-sm);
}
.smap__legend {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-top: var(--space-7);
  color: var(--fg-muted);
  font-size: var(--text-sm);
}
@media (max-width: 40rem) {
  .xc__row,
  .xc__nav,
  .xc__group {
    flex-wrap: nowrap;
  }
  .xc__row--site {
    display: grid;
    gap: var(--space-2);
  }
  .xc__nav,
  .xc__group {
    overflow-x: auto;
    scrollbar-width: none;
  }
  .xc__row:first-child {
    display: grid;
    gap: var(--space-2);
  }
}
@media (max-width: 60rem) {
  .smap__tree {
    grid-template-columns: 1fr;
    gap: var(--space-4);
  }
  .smap__lines {
    display: none;
  }
  .smap__col[data-children] {
    padding-left: var(--space-5);
    border-left: 1px solid var(--line-strong);
  }
  .xc__sub {
    display: none;
  }
}

[data-proposal=vault] .v-hero {

[data-proposal=vault] .v-hero__grid {

[data-proposal=vault] .v-hero__copy {

[data-proposal=vault] .v-eyebrow {

[data-proposal=vault] .v-hero__role {

}
[data-proposal=vault] .v-cred {
  display: grid;
  gap: var(--space-4);
  width: 100%;
  max-width: 30rem;
  justify-self: end;
  perspective: 1400px;
}
[data-proposal=vault] .v-cred__inner {
  --rx: 0deg;
  --ry: 0deg;
  --mx: 50%;
  --my: 50%;
  position: relative;
  aspect-ratio: 1.586;
  transform: rotateX(var(--rx)) rotateY(calc(var(--ry) + var(--flip, 0deg)));
  transform-style: preserve-3d;
  transition: transform var(--dur-slow) var(--ease-out);
}
[data-proposal=vault] .v-cred__inner.is-tilting {
  transition: transform var(--dur-fast) linear;
}
[data-proposal=vault] .v-cred[data-flipped=true] .v-cred__inner {
  --flip: 180deg;
}
[data-proposal=vault] .v-cred__face {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: var(--space-4);
  padding: var(--space-5);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-xl);
  background:
    linear-gradient(
      150deg,
      var(--surface-raised),
      var(--surface) 55%,
      var(--bg-alt));
  backface-visibility: hidden;
  overflow: hidden;
}
[data-proposal=vault] .v-cred__face::before {
  content: "";

  inset: 0;
  background:
    repeating-radial-gradient(
      circle at 110% -10%,
      transparent 0 9px,
      color-mix(in srgb, var(--fg) 5%, transparent) 9px 10px),
    repeating-linear-gradient(
      135deg,
      color-mix(in srgb, var(--accent) 5%, transparent) 0 1px,
      transparent 1px 11px);
  pointer-events: none;
}
[data-proposal=vault] .v-cred__face > * {
  position: relative;
}
[data-proposal=vault] .v-cred__face--back {
  grid-template-rows: auto 1fr;
  align-content: start;
  transform: rotateY(180deg);
}
[data-proposal=vault] .v-cred__sheen {
  position: absolute;
  inset: 0;
  border-radius: var(--radius-xl);
  background:
    radial-gradient(
      circle at var(--mx) var(--my),
      color-mix(in srgb, var(--accent) 20%, transparent),
      transparent 45%);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur) var(--ease-out);
}
[data-proposal=vault] .v-cred__inner:hover .v-cred__sheen {

[data-proposal=vault] .v-cred__row {

}
[data-proposal=vault] .v-cred__status {

[data-proposal=vault] .v-cred__role {

[data-proposal=vault] .v-cred__fp {

      mountDisclosures(stage, state);
      view.mount?.(stage, ctx);
      const meta = proposalMeta.find((p) => p.id === route.proposal);
      document.title = route.view === "site" ? `${meta.name} · ${route.page} · Klefas Web3 Look` : `${route.view === "compare" ? "Compare" : "Overview"} · Klefas Web3 Look`;
      window.scrollTo(0, scroll === "top" ? 0 : y);
      if (focusKey) {
        const target = app.querySelector(`[data-key="${CSS.escape(focusKey)}"]`);
        if (target && target !== document.activeElement) target.focus({ preventScroll: true });
      }
    }
    async function copyFrom(button) {
      const ok = await copyText(button.dataset.copy);
      const label = button.querySelector("[data-copy-label]");
      if (label) {
        const original = label.textContent;
        label.textContent = ok ? "Copied" : "Copy failed";
        setTimeout(() => label.textContent = original, 1600);
      }
      announce(ok ? "Copied to the clipboard" : "Copy failed. Select the text instead.");
    }
    delegate(app, "click", "[data-action]", (event, el) => {
      const action = el.dataset.action;
      if (action === "theme") setTheme(route.theme === "dark" ? "light" : "dark");
      else if (action === "set-theme") setTheme(el.dataset.value);
      else if (action === "copy") copyFrom(el);
      else if (action === "set") {
        state[el.dataset.state] = el.dataset.value;
        render({ scroll: "keep" });
      } else if (action === "skip" || action === "scroll") {
        event.preventDefault();
        const target = action === "skip" ? $("#main", stage) : stage.querySelector(`#${CSS.escape(el.dataset.target)}`);
        if (!target) return;
        target.scrollIntoView({ behavior: prefersReducedMotion() ? "auto" : "smooth", block: "start" });
        if (!target.hasAttribute("tabindex")) target.setAttribute("tabindex", "-1");
        target.focus({ preventScroll: true });
      }
    });
    window.addEventListener("hashchange", () => navigate(parseRoute(location.hash, projectIds, route)));
    if ("ResizeObserver" in window) {
      new ResizeObserver(() => document.documentElement.style.setProperty("--chrome-h", `${chrome.offsetHeight}px`)).observe(chrome);
    }
    render({ scroll: "top" });
    return { navigate, setTheme, get route() {
      return route;
    } };
  }

  // src/main.js
  function start() {
    const app = document.getElementById("app");
    if (app) createShell(app, { proposals, content });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();

        </script>
    </body>
</html>
